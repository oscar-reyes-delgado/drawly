name: drawly
description: "Drawly: estudio completo de dibujo y animacion 2D"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image: ^4.13.1
  archive: ^4.7.1
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: ^13.4.0
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  record: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  shaders:
    - shaders/lut.frag
    - shaders/motion_blur.frag
    - shaders/radial_blur.frag
    - shaders/sharpen.frag
    - shaders/denoise.frag
    - shaders/noise.frag
    - shaders/pixelate.frag
    - shaders/halftone.frag
    - shaders/kuwahara.frag
    - shaders/comic.frag
    - shaders/edges.frag
    - shaders/vignette.frag
    - shaders/chromatic.frag
    - shaders/lens.frag
    - shaders/chroma_key.frag
    - shaders/softproof.frag
    - shaders/ants.frag
